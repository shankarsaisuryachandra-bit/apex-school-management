server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: school-management-system

  datasource:
    url: jdbc:h2:file:./data/schooldb;AUTO_SERVER=TRUE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:your-school-email@gmail.com}
    password: ${GMAIL_APP_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:mySchoolManagementSystemSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2025}
    expiration-ms: 86400000       # 24 hours
    refresh-expiration-ms: 604800000  # 7 days
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}

# File Upload
  upload:
    dir: ./uploads
    max-image-width: 1920

logging:
  level:
    com.sms: DEBUG
    org.springframework.security: INFO
